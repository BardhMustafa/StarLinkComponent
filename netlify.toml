# Netlify detects Next.js and applies its Next.js runtime (OpenNext adapter)
# automatically: static pages go to the CDN, the RFQ Server Action and
# middleware run as functions. This file overrides any build settings left
# in the Netlify UI from the old Astro site (npm run build → dist).

[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  # Next.js 15 needs Node ≥ 18.18 and pnpm 10 ≥ 18.12; the project targets 20.11+.
  NODE_VERSION = "22"
